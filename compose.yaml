services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: housing_offers
            MYSQL_USER: housing_offers
            MYSQL_PASSWORD: housing_offers
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "housing_offers", "-phousing_offers"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql_data:
