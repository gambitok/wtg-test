services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            APP_URL: http://localhost:8000
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: housing_offers
            DB_USERNAME: housing_offers
            DB_PASSWORD: housing_offers
            QUEUE_CONNECTION: database
        depends_on:
            mysql:
                condition: service_healthy
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www/html

    queue:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: housing_offers
            DB_USERNAME: housing_offers
            DB_PASSWORD: housing_offers
            QUEUE_CONNECTION: database
        depends_on:
            mysql:
                condition: service_healthy
        volumes:
            - .:/var/www/html
        command: ["php", "artisan", "queue:work", "database", "--tries=1", "--timeout=90"]

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: housing_offers
            MYSQL_USER: housing_offers
            MYSQL_PASSWORD: housing_offers
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "housing_offers", "-phousing_offers"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql_data:
